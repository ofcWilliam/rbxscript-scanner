<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff4757" />

    <title>Roblox Script Scanner</title>
    <meta name="description"
        content="Identify malicious patterns, IP loggers, and account stealers in Roblox scripts instantly.">

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
        // This script takes the current URL (which GitHub Pages thinks is a 404)
        // and converts it into a query parameter, then redirects back to index.html.
        // React Router then reads that query parameter to show the correct page.
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!-- <link rel="manifest" href="%PUBLIC_URL%/manifest.json" /> -->
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Note: When GitHub serves this 404, it still loads your React App -->
</body>

</html>
