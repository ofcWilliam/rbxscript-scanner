<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/rbxscript-scanner/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff2e2e" />

    <title>PAGE_NOT_FOUND | 404</title>

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, (l.pathname.slice(-1) === '/' ? -1 : l.pathname.length)) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->

    <style>
        :root {
            --bg: #050505;
            --danger: #ff2e2e;
            --danger-faded: rgba(255, 46, 46, 0.15);
            --text-main: #ffffff;
            --text-dim: #888888;
        }

        html {
            background-color: var(--bg);
        }


        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body {
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(255, 62, 62, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(255, 62, 62, 0.03) 0%, transparent 40%);
        }

        /* Scanline Glitch Effect Over the whole screen */
        body::after {
            content: " ";
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 2px), linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
            background-size: 56px 56px;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes flicker {
            0% {
                opacity: 0.95;
            }

            5% {
                opacity: 0.85;
            }

            10% {
                opacity: 0.95;
            }

            100% {
                opacity: 1;
            }
        }

        .container {
            width: 90%;
            max-width: 600px;
            position: relative;
            z-index: 5;
            animation: flicker 0.2s infinite;
        }

        .alert_box {
            background: rgba(10, 0, 0, 0.9);
            border: 2px solid var(--danger);
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(255, 46, 46, 0.2);
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .alert_box::before {
            content: "FAULT_DETECTED";
            position: absolute;
            top: 5px;
            right: 10px;
            font-family: monospace;
            font-size: 10px;
            color: var(--danger);
            letter-spacing: 2px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--danger-faded);
            padding-bottom: 20px;
        }

        .icon_warning {
            color: var(--danger);
            font-size: 40px;
            font-weight: 900;
        }

        .fault_title {
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin: 0;
            color: var(--danger);
        }

        .data_stack {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .entry {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label {
            font-family: monospace;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--danger);
            opacity: 0.7;
        }

        .content {
            font-size: 18px;
            line-height: 1.5;
            color: var(--text-main);
        }

        .path_highlight {
            font-family: monospace;
            background: var(--danger-faded);
            padding: 6px 12px;
            border-radius: 3px;
            border: 1px solid rgba(255, 46, 46, 0.3);
            word-break: break-all;
            display: inline-block;
            margin-top: 5px;
        }

        .reboot_container {
            margin-top: 40px;
            text-align: center;
        }

        .reboot_btn {
            background: var(--danger);
            color: white;
            text-decoration: none;
            padding: 20px 40px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 14px;
            border-radius: 2px;
            transition: all 0.2s;
            display: inline-block;
        }

        .reboot_btn:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 40px var(--danger-faded);
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="alert_box">
            <div class="header">
                <span class="icon_warning">⚠</span>
                <h1 class="fault_title">System Failure</h1>
            </div>

            <div class="data_stack">
                <div class="entry">
                    <span class="label">Fault Code</span>
                    <span class="content">PAGE_NOT_FOUND (404)</span>
                </div>

                <div class="entry">
                    <span class="label">Target Page</span>
                    <span class="content">
                        <div id="path_out" class="path_highlight">fetching...</div>
                    </span>
                </div>

                <div class="entry">
                    <span class="label">Analysis</span>
                    <span class="content" style="color: var(--text-dim); font-size: 16px;">
                        We're sorry! <br /><br />
                        The requested directory doesn't exist, has been purged, or has moved to another location. <br /><br />
                        Let's get you back home.
                        </span>
                    </span>
                </div>
            </div>
        </div>

        <div class="reboot_container">
            <a href="/rbxscript-scanner/" class="reboot_btn">
                Initialize System Reboot
            </a>
        </div>
    </div>

    <script>
        const rawPath = window.location.pathname;
        const cleanPath = rawPath.replace('/rbxscript-scanner', '') || '/';
        document.getElementById('path_out').textContent = cleanPath;
    </script>
</body>

</html>
